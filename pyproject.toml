[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketr0-hardmine"
version = "0.1.0"
description = "按多个错误信号给样本打分，选出高难度子集并给出分布"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rocketr0" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rocketr0.github.io"
Repository = "https://github.com/rocketr0/hardmine"
Issues = "https://github.com/rocketr0/hardmine/issues"

[project.scripts]
hardmine = "hardmine:main"

[tool.setuptools]
py-modules = ["hardmine"]
